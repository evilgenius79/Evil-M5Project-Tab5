; PlatformIO project configuration for the Evil-M5Project Tab5 full port (ESP32-P4)
; ---------------------------------------------------------------------------
; The ESP32-P4 is NOT supported by the upstream platformio/espressif32 platform,
; so this uses the community "pioarduino" fork, which ships the ESP32-P4 Arduino
; core. Bump the version tag below if a newer pioarduino release is out:
; https://github.com/pioarduino/platform-espressif32
;
; IMPORTANT: PlatformIO concatenates EVERY .ino found under src_dir into one file.
; This repo has many device sketches at the root, so src_dir points at the full
; port's OWN folder (Evil-M5Tab5/) which contains only Evil-M5Tab5.ino. Do not set
; src_dir back to "." or PlatformIO will try to compile all the sketches together.
;
; Build & upload (put the Tab5 in download mode first: USB-C connected, long-press
; Reset ~2s until the internal green LED blinks fast, then release):
;     pio run -e m5tab5-full                # compile
;     pio run -e m5tab5-full -t upload      # flash over USB-C
;     pio device monitor -e m5tab5-full     # serial @ 115200
;
; To build the leaner Core3 port instead, set src_dir = Evil-Tab5-v1-0 and put that
; sketch in its own folder too (Evil-Tab5-v1-0/Evil-Tab5-v1-0.ino).
; ---------------------------------------------------------------------------

[platformio]
; Only the full port's folder — one .ino inside — so PlatformIO builds just it.
src_dir = Evil-M5Tab5
default_envs = m5tab5-full

[env:m5tab5-full]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4

; Flash / memory (Tab5 = 16MB flash, 32MB octal PSRAM)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

upload_speed = 1500000            ; lower to 921600/460800 if uploads time out
monitor_speed = 115200

; IniFile declares a dependency on "SD", which makes PlatformIO's LDF pull the old
; Arduino AVR SD library (Sd2PinMap.h -> "#error Architecture or board not supported"),
; shadowing the ESP32 framework's built-in SD and breaking IniFile's FILE_READ/mode_t.
; Ignore the registry SD so <SD.h> resolves to the framework SD (what the Arduino IDE uses).
lib_ignore = SD

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1    ; route Serial to the USB-C port
    ; lib_ignore=SD removes the bad AVR SD, but IniFile (built in isolation) then can't
    ; find the framework SD header. Add the framework's SD/FS/SPI include paths so
    ; <SD.h> (and its FS.h/SPI.h dependencies) resolve to the ESP32 framework versions.
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD/src"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/SPI/src"
    ; If USB HID (BadUSB / BT-less keyboard) fails to build on P4 under PlatformIO,
    ; uncomment the next line to disable it (matches an in-sketch flag):
    ; -DEVIL_DISABLE_USB_HID=1

; SSH Shell and AsyncWebServer are disabled in-source by default (EVIL_ENABLE_SSH=0,
; EVIL_DISABLE_ASYNC_WEBSERVER=1), so libssh_esp32 / ESPAsyncWebServer are NOT needed.
lib_deps =
    m5stack/M5Unified@^0.2.17
    m5stack/M5GFX@^0.2.22
    adafruit/Adafruit NeoPixel@^1.12.0
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^6.21.5   ; sketch uses the v6 API (DynamicJsonDocument)
    stevemarple/IniFile             ; theme/config .ini parsing (<IniFile.h>)
    dvarrel/ESPping                 ; network ping (<ESPping.h>)

; ---------------------------------------------------------------------------
; Notes / likely tweak points (this was authored, not compiled here):
;  - board: esp32-p4-evboard is the generic pioarduino P4 board. The sketch sets its
;    own pins (WiFi.setPins for the C6, SD SPI pins), so board pin defaults don't matter;
;    the main risk area is USB-HID config (see the EVIL_DISABLE_USB_HID flag above).
;  - If a lib_deps name doesn't resolve, install its Arduino-IDE equivalent instead:
;    IniFile = "IniFile" by Steve Marple; ESPping = "ESPping" by dvarrel.
;  - WiFi/BLE run on the on-board ESP32-C6 via ESP-Hosted; the pioarduino core pulls
;    that in for the P4 build. Validate radio-heavy features on hardware.
; ---------------------------------------------------------------------------
