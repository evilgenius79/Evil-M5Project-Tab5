; PlatformIO project configuration for Evil-Tab5 (M5Stack Tab5 / ESP32-P4)
; ---------------------------------------------------------------------------
; The ESP32-P4 is NOT supported by the upstream platformio/espressif32 platform,
; so this uses the community "pioarduino" fork, which ships the ESP32-P4 Arduino
; core (arduino-esp32 3.x / ESP-IDF 5.4). Update the version tag below if a newer
; pioarduino release is out: https://github.com/pioarduino/platform-espressif32
;
; This repo keeps every device's firmware as a separate .ino at the repo root, so
; `build_src_filter` compiles ONLY the Tab5 sketch and ignores all the others
; (Core3, Cardputer, the slave/ and utilities/ sketches, etc.).
;
; Build & upload:
;     pio run -e m5tab5                 # compile
;     pio run -e m5tab5 -t upload       # flash over USB-C (see download-mode note)
;     pio device monitor -e m5tab5      # serial @ 115200
;
; Put the Tab5 in download mode first: with USB-C connected, long-press Reset ~2s
; until the internal green LED blinks rapidly, then release.
; ---------------------------------------------------------------------------

[platformio]
; Sources live at the repo root (the .ino files), not in a src/ folder.
src_dir = .

[env:m5tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4

; Compile ONLY the Tab5 firmware from the repo root; exclude every other sketch.
build_src_filter = -<*> +<Evil-Tab5-v1-0.ino>

; --- Flash / memory (Tab5 = 16MB flash, 32MB octal PSRAM) ---
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; --- Upload / monitor ---
upload_speed = 1500000           ; lower to 921600/460800 if uploads time out
monitor_speed = 115200

; --- Build flags ---
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; route Serial to the USB-C port; comment out if using a UART bridge

; --- Libraries actually used by Evil-Tab5-v1-0.ino ---
; (WiFi, WebServer, DNSServer, SD, SD_MMC and BLE come from the ESP32 Arduino
;  framework and do not need to be listed here.)
; Tab5 requires recent M5 drivers: M5Unified >= 0.2.17, M5GFX >= 0.2.22.
lib_deps =
    m5stack/M5Unified@^0.2.17
    m5stack/M5GFX@^0.2.22
    adafruit/Adafruit NeoPixel@^1.12.0
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^6.21.5   ; sketch uses the v6 API (DynamicJsonDocument)

; ---------------------------------------------------------------------------
; Note: the ESP32-P4 has no native radio. WiFi/BLE run on the on-board ESP32-C6
; via ESP-Hosted (esp_wifi_remote), which the pioarduino core pulls in for the
; P4 build. BLE (BLEDevice.h) support through the hosted path is the least-proven
; part of this port and should be validated on hardware.
; ---------------------------------------------------------------------------
