; PlatformIO project configuration for the Evil-M5Project Tab5 ports (ESP32-P4)
; ---------------------------------------------------------------------------
; The ESP32-P4 is NOT supported by the upstream platformio/espressif32 platform,
; so this uses the community "pioarduino" fork, which ships the ESP32-P4 Arduino
; core (arduino-esp32 3.x / ESP-IDF 5.x). Bump the version tag below if a newer
; pioarduino release is out: https://github.com/pioarduino/platform-espressif32
;
; This repo keeps each firmware as a separate .ino at the repo root, so each env
; uses build_src_filter to compile ONLY its sketch and ignore the others.
;
; Two environments:
;   m5tab5-full   -> Evil-M5Tab5.ino     (the author's full ~90-feature port; default)
;   m5tab5-core3  -> Evil-Tab5-v1-0.ino  (the leaner Core3-based port; fallback)
;
; Build & upload (put the Tab5 in download mode first: USB-C connected, long-press
; Reset ~2s until the internal green LED blinks fast, then release):
;     pio run -e m5tab5-full                # compile the full port
;     pio run -e m5tab5-full -t upload      # flash over USB-C
;     pio device monitor -e m5tab5-full     # serial @ 115200
; ---------------------------------------------------------------------------

[platformio]
; Sources live at the repo root (the .ino files), not in a src/ folder.
src_dir = .
default_envs = m5tab5-full

; ---- Shared settings applied to every environment ----
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4

; Flash / memory (Tab5 = 16MB flash, 32MB octal PSRAM)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

upload_speed = 1500000            ; lower to 921600/460800 if uploads time out
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1    ; route Serial to the USB-C port
    ; If USB HID (BadUSB / BT-less keyboard) fails to build on P4 under PlatformIO,
    ; uncomment the next line to disable it for the full port (matches an in-sketch flag):
    ; -DEVIL_DISABLE_USB_HID=1

; ===========================================================================
;  Full port — Evil-M5Tab5.ino  (7h30th3r0n3's Cardputer-based Tab5 firmware)
; ===========================================================================
[env:m5tab5-full]
build_src_filter = -<*> +<Evil-M5Tab5.ino>
; SSH Shell and AsyncWebServer are disabled in-source by default (EVIL_ENABLE_SSH=0,
; EVIL_DISABLE_ASYNC_WEBSERVER=1), so libssh_esp32 / ESPAsyncWebServer are NOT needed.
lib_deps =
    m5stack/M5Unified@^0.2.17
    m5stack/M5GFX@^0.2.22
    adafruit/Adafruit NeoPixel@^1.12.0
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^6.21.5   ; sketch uses the v6 API (DynamicJsonDocument)
    stevemarple/IniFile             ; theme/config .ini parsing (<IniFile.h>)
    dvarrel/ESPping                 ; network ping (<ESPping.h>)

; ===========================================================================
;  Fallback — Evil-Tab5-v1-0.ino  (leaner Core3-based Tab5 port)
; ===========================================================================
[env:m5tab5-core3]
build_src_filter = -<*> +<Evil-Tab5-v1-0.ino>
lib_deps =
    m5stack/M5Unified@^0.2.17
    m5stack/M5GFX@^0.2.22
    adafruit/Adafruit NeoPixel@^1.12.0
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^6.21.5

; ---------------------------------------------------------------------------
; Notes / likely tweak points (this was authored, not compiled here):
;  - board: esp32-p4-evboard is the generic pioarduino P4 board. The sketch sets its
;    own pins (WiFi.setPins for the C6, SD SPI pins), so board pin defaults don't matter;
;    the main risk area is USB-HID config (see the EVIL_DISABLE_USB_HID flag above).
;  - If a lib_deps name doesn't resolve, install its Arduino-IDE equivalent instead:
;    IniFile = "IniFile" by Steve Marple; ESPping = "ESPping" by dvarrel.
;  - WiFi/BLE run on the on-board ESP32-C6 via ESP-Hosted; the pioarduino core pulls
;    that in for the P4 build. Validate radio-heavy features on hardware.
; ---------------------------------------------------------------------------
